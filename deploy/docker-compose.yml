# 可选：团队共享服务器 / 生产容器化部署模板（非本地开发必需；本地可直接零 Docker 运行 pnpm dev）
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhizhi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhizhi_dev_password}
      POSTGRES_DB: zhizhi
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
